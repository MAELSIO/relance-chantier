services:
  - type: web
    name: relance-chantier-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    # Les donnees vivent dans Postgres (Supabase), pas sur le disque de Render.
    # Ca resout la perte de donnees du plan gratuit : ce disque etait remis a
    # zero a chaque redemarrage du service (mise en veille apres ~15 min
    # d'inactivite), et la base SQLite qui y vivait disparaissait avec lui.
    # Supabase est externe et persiste independamment du cycle de vie du
    # service Render, donc aucun disque persistant n'est necessaire ici.
