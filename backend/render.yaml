services:
  - type: web
    name: relance-chantier-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    # Pas de disque persistant : indisponible sur le plan gratuit de Render.
    # Consequence : la base SQLite est remise a zero a chaque redemarrage du
    # service gratuit (inactivite ~15 min = mise en veille). Suffisant pour
    # tester, pas pour de vrais clients qui comptent dessus dans la duree.
    # Pour un stockage qui persiste vraiment, passer au plan payant "Starter"
    # (~7$/mois) et reactiver un bloc "disk" ici (name, mountPath, sizeGB).
